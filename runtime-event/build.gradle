plugins {
    id 'java-library'
}

dependencies {
    implementation project(':runtime-core')
    implementation project(':runtime-module')
    implementation 'jakarta.inject:jakarta.inject-api:2.0.1'
    implementation 'com.google.inject:guice:5.1.0' 
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2' // ADD for Instant serialization

    // ADD THESE 2 LINES
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21) // North Star #5: Java 21
    }
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}
