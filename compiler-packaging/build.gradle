plugins {
    id 'java-library'
}

dependencies {
    implementation project(':compiler-core')
    implementation project(':runtime-config')
    implementation project(':compiler-dsl')
    implementation project(':compiler-contracts')
    implementation project(':compiler-workflow')
    implementation project(':compiler-projection')
    implementation project(':compiler-generator')
    implementation project(':compiler-blueprint')    
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2' // FIX: for JavaTimeModule
    implementation 'com.fasterxml.jackson.module:jackson-module-jakarta-xmlbind-annotations:2.17.2'
    
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
