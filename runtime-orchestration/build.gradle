plugins {
    id 'java'
}

dependencies {
    implementation project(':runtime-core')
    implementation project(':runtime-module')
    implementation project(':runtime-config')
    implementation project(':runtime-event')
    implementation project(':runtime-workflow')
    implementation project(':compiler-dsl')
    implementation project(':runtime-bootstrap')
    implementation 'com.google.inject:guice:5.1.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'
    implementation 'jakarta.inject:jakarta.inject-api:2.0.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    
    // Fixed: Missing platform launcher on test execution path resolved
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// Added testing lifecycle logging block for execution consistency across modules
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }
}

