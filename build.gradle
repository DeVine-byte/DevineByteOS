plugins {
    id 'java'
}

allprojects {
    group = 'io.devinebyte'
    version = '1.0.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    java {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs += ['-parameters']
    }

    dependencies {
        implementation 'jakarta.inject:jakarta.inject-api:2.0.1'
        testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    }

    test {
        useJUnitPlatform()
    }
}

// --- Root Project Tasks & Logic ---

def pluginsStagingDir = layout.buildDirectory.dir("plugins")

// 1. Task: Collect all module jars into build/plugins/
tasks.register('stagePluginJars', Copy) {
    group = "build"
    description = "Collects all module jars for packaging"

    def pluginModules = [':modules:crm', ':modules:sales', ':modules:inventory', ':modules:finance']

    pluginModules.each { modulePath ->
        dependsOn "${modulePath}:jar"
        from(project(modulePath).tasks.named('jar'))
    }

    into pluginsStagingDir
    include "*.jar"

    eachFile { details ->
        details.name = details.name.replace("-${project.version}", "-1.0.0")
    }
}

// 2. Task: Run compiler-cli natively using JavaExec matching your precise parameters
tasks.register('packageDbpkg', JavaExec) {
    group = "build"
    description = "Builds the tenant .dbpkg with plugins injected"

    dependsOn stagePluginJars

    def cliProject = project(':compiler-cli')
    mainClass = 'io.devinebyte.compiler.cli.CompilerCli'
    classpath = cliProject.configurations.runtimeClasspath + cliProject.tasks.named('jar').get().outputs.files

    workingDir rootDir

    // FIX: Aligned perfectly with your manual compiler arguments signature
    args 'compile', 
         '-d', "${rootDir.absolutePath}/samples/acme.dbdsl",
         '-t', 'acme',
         '-v', '1.0.0',
         '-o', "${rootDir.absolutePath}/execution"
}

// 3. Convenience task
tasks.register('buildAndPackage') {
    dependsOn packageDbpkg
}

