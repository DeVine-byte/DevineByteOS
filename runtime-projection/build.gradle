plugins {
    id 'java'
}

group = 'io.devinebyte'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':runtime-core')
    implementation project(':runtime-event')
    implementation project(':runtime-module')
    implementation project(':compiler-projection')
    // REMOVED: implementation project(':runtime-workflow') // This causes cycle

    implementation 'io.github.kawamuray:wasmtime-java:22.0.0' // CHANGED from 25.0.0
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
    implementation 'jakarta.inject:jakarta.inject-api:2.0.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.test { useJUnitPlatform() }
